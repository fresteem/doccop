name: doccop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` invokes tsc which type-checks AND emits dist/. Downstream
      # workspaces resolve @doccop/* via node_modules symlinks that point
      # at dist/, so it must run before any step that imports cross-
      # package types (test, api:check).
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: API surface check
        run: npm run api:check

      - name: License check
        run: npm run license:check
